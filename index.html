<!DOCTYPE html>

<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>

/* 🔥 NO WHITE SCREEN FIX */
html,body{
    margin:0;
    padding:0;
    background:#030303;
    font-family:'Outfit',sans-serif;
    color:white;
    min-height:100vh;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    transition:0.4s ease;
    overflow-x:hidden;
}

/* THEMES */
body.online{
    background:radial-gradient(circle at top,#0a2a10,#000);
}

body.offline{
    background:radial-gradient(circle at top,#2a0a0a,#000);
}

/* STATUS */
.status-box{
    position:fixed;
    top:10px;
    right:10px;
    padding:8px 14px;
    border-radius:50px;
    font-weight:800;
    font-size:13px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    z-index:999;
    transition:0.3s;
}

.online .status-box{
    color:#00ff66;
    border:1px solid #00ff66;
}

.offline .status-box{
    color:#ff3b3b;
    border:1px solid #ff3b3b;
}

/* MUSIC */
.music-bar{
    position:fixed;
    top:10px;
    left:10px;
    padding:8px 12px;
    border-radius:50px;
    cursor:pointer;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    z-index:999;
    font-size:13px;
    user-select:none;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.15);
}

.music-bar:hover{
    background:rgba(255,255,255,0.1);
}

.music-bar.playing{
    animation:pulse 1.5s infinite;
    border-color:#00ff66;
}

@keyframes pulse{
    0%{ box-shadow:0 0 0 rgba(0,255,100,0.4); }
    50%{ box-shadow:0 0 12px rgba(0,255,100,0.6); }
    100%{ box-shadow:0 0 0 rgba(0,255,100,0.4); }
}

/* MAIN */
.container{
    width:100%;
    max-width:460px;
    padding:15px;
    text-align:center;
    z-index:2;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    padding:30px 25px;
    border-radius:22px;
    backdrop-filter:blur(12px);
}

/* PROFILE FRAME */
.profile-frame{
    width:140px;
    height:140px;
    margin:auto;
    border-radius:50%;
    padding:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
    cursor:pointer;
    position:relative;
}

.profile-frame:hover{
    transform:scale(1.03);
}

.online .profile-frame{
    border:3px solid #00ff66;
    box-shadow:0 0 25px rgba(0,255,100,0.5);
}

.offline .profile-frame{
    border:3px solid #ff3b3b;
    box-shadow:0 0 25px rgba(255,0,0,0.4);
}

.profile-frame img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center top;
}

/* NAME + BADGE */
.name-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:14px;
}

.name{
    font-size:22px;
    font-weight:800;
}

.verified-badge{
    flex-shrink:0;
}

.tagline{
    font-size:13px;
    opacity:0.8;
    margin-top:4px;
}

/* ABOUT */
.about{
    font-size:14px;
    opacity:0.85;
    margin-top:14px;
    line-height:1.5;
}

/* SOCIAL */
.social{
    margin-top:20px;
}

.social a{
    font-size:24px;
    margin:0 10px;
    color:gray;
    transition:0.3s;
    display:inline-block;
}

.social a:hover{
    color:white;
    transform:translateY(-2px);
}

/* HELP */
.help-btn{
    position:fixed;
    bottom:15px;
    right:15px;
    padding:12px 16px;
    border:none;
    border-radius:50px;
    font-weight:900;
    cursor:pointer;
    z-index:999;
}

.online .help-btn{ background:#00ff66; color:black; }
.offline .help-btn{ background:#ff3b3b; color:white; }

/* POPUP */
.popup{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    border:1px solid rgba(255,255,255,0.15);
    padding:10px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    font-size:13px;
    z-index:999;
    white-space:nowrap;
}

.popup.show{ opacity:1; }

</style>
</head>
<body>

</MUSIC>

</audio>

<!-- STATUS -->
<div id="status" class="status-box">LOADING...</div>

<!-- POPUP (fixed, single instance) -->
<div class="popup" id="popup">👋 Hey, thanks for visiting!</div>

<!-- MAIN -->
<div class="container">
    <div class="card">

        <div class="profile-frame">
            <img src="diyan.png" alt="Diyan Sharma profile photo">
        </div>

        <div class="name-row">
            <span class="name">Diyan Sharma</span>
            <svg class="verified-badge" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#1DA1F2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M10.2 15.2L6.9 11.9L5.5 13.3L10.2 18L18.5 9.7L17.1 8.3Z" fill="white"/>
            </svg>
        </div>

        <div class="tagline">Future Software Engeener • Grade 9</div>

        <div class="about">
            I am Diyan Sharma. I have basic knowledge of Science and technology.
        </div>

        <div class="social">
            <a href="https://www.facebook.com/share/1BuUifGyoU/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="https://instagram.com/diyansharma2799" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/9779849474640" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>

    </div>
</div>

<button class="help-btn" onclick="location.href='chat.html'">💬 HELP</button>

<script>
/* 🔥 NO WHITE SCREEN SAFETY */
document.body.style.background = "#030303";

/* FIREBASE SAFE INIT */
const firebaseConfig = {
    apiKey: "AIzaSyBxCJJLsZQtlwPyWgvl2dO25-eSpOYEg", // ⚠️ Double-check this in your Firebase console — real keys are 39 characters, this looks short and may not connect
    authDomain: "ff-tournament-app-abcf0.firebaseapp.com",
    databaseURL: "https://ff-tournament-app-abcf0-default-rtdb.firebaseio.com",
    projectId: "ff-tournament-app-abcf0"
};

const statusEl = document.getElementById("status");

try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("status").on("value", snap => {
        const val = snap.val() || "offline";
        document.body.classList.remove("online", "offline");
        if (val === "online") {
            document.body.classList.add("online");
            statusEl.innerText = "● ONLINE";
        } else {
            document.body.classList.add("offline");
            statusEl.innerText = "● OFFLINE";
        }
    }, error => {
        console.error("Firebase read error:", error);
        document.body.classList.add("offline");
        statusEl.innerText = "● OFFLINE";
    });
} catch (err) {
    console.error("Firebase init error:", err);
    document.body.classList.add("offline");
    statusEl.innerText = "● OFFLINE";
}

/* MUSIC */
const music = document.getElementById("music");
const musicBar = document.getElementById("musicBar");
let playing = false;

function toggleMusic() {
    if (!music.querySelector("source") && !music.src) {
        musicBar.innerHTML = "🎵 No track set";
        setTimeout(() => musicBar.innerHTML = "🎵 MUSIC", 1500);
        return;
    }
    if (playing) {
        music.pause();
        music.currentTime = 0;
        playing = false;
        musicBar.classList.remove("playing");
        musicBar.innerHTML = "🎵 MUSIC";
    } else {
        music.play().then(() => {
            playing = true;
            musicBar.classList.add("playing");
            musicBar.innerHTML = "🎵 PLAYING";
        }).catch(err => {
            console.error("Music Error:", err);
        });
    }
}

music.addEventListener("ended", () => {
    playing = false;
    musicBar.classList.remove("playing");
    musicBar.innerHTML = "🎵 MUSIC";
});

/* POPUP */
document.querySelector(".profile-frame").onclick = () => {
    const p = document.getElementById("popup");
    p.classList.add("show");
    setTimeout(() => p.classList.remove("show"), 2000);
};
</script>
</body>
</html>
